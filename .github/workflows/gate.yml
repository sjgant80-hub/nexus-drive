name: gate
on: [push, pull_request]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: tests (all modules)
        run: node --test
      - name: mutation gate — every module must be CLEAN
        run: node tools/gate-all.mjs
      - name: page fixpoint — the live logic IS the gated modules
        run: |
          node make-page.mjs
          git diff --exit-code index.html
